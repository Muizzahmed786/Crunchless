<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crunchless Capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <strong>Crunchless Capture</strong>
      <p>Select text on a page or email, right-click it, and choose <b>Save selection to Crunchless</b>.</p>
      <p class="privacy">Only the text you select is captured. It stays in this browser until the app receives it.</p>
      <span id="status" role="status">Checking saved captures…</span>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
